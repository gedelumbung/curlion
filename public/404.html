<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Not found · Curlion</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0d1017;
        --fg: #bfbdb6;
        --muted: #6c7380;
        --accent: #e6b450;
        --on-accent: #0d1017;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fcfcfc;
          --fg: #5c6166;
          --muted: #8a9199;
          --accent: #ffaa33;
          --on-accent: #1f2328;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        padding: 24px;
        text-align: center;
      }
      code {
        font: 600 72px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--accent);
      }
      p {
        margin: 12px 0 24px;
        color: var(--muted);
      }
      a {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 5px;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <code>404</code>
      <p>This page does not exist.</p>
      <a href="/">Open Curlion</a>
    </main>
  </body>
</html>
