<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke-width="6">
  <style>
    .ring { stroke: #1c1c1e; }
    @media (prefers-color-scheme: dark) { .ring { stroke: #f2f2f4; } }
  </style>
  <defs>
    <!-- straight vertical slot through both rings, below the centre dot -->
    <mask id="slot" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff" />
      <rect x="29.25" y="42" width="5.5" height="22" fill="#000" />
    </mask>
  </defs>
  <g mask="url(#slot)">
    <circle class="ring" cx="32" cy="32" r="27" />
    <circle cx="32" cy="32" r="16" stroke="#4caf50" />
  </g>
  <circle cx="32" cy="32" r="5" stroke="#4caf50" stroke-width="4.5" />
</svg>
